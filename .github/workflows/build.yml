name: Build Argon IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Скачивание файлов проекта
        uses: actions/checkout@v4

      - name: Установка XcodeGen и ldid
        run: brew install xcodegen ldid

      - name: Создание проекта Xcode
        run: xcodegen generate

      - name: Сборка приложения
        run: |
          xcodebuild clean build \
            -project Argon.xcodeproj \
            -scheme Argon \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Прошивка прав для TrollStore (ldid)
        run: |
          APP="build/Build/Products/Release-iphoneos/Argon.app"
          ldid -SArgon.entitlements "$APP/PlugIns/ArgonTunnel.appex/ArgonTunnel"
          ldid -SArgon.entitlements "$APP/Argon"

      - name: Упаковка в .ipa
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/Argon.app" Payload/
          zip -r Argon-TrollStore.ipa Payload

      - name: Выгрузка готового файла
        uses: actions/upload-artifact@v4
        with:
          name: Argon-TrollStore-IPA
          path: Argon-TrollStore.ipa
