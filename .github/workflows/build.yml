name: Build Argon Pro IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Скачивание файлов проекта
        uses: actions/checkout@v4

      - name: Установка XcodeGen и ldid
        run: brew install xcodegen ldid

      - name: Скачивание и распаковка ядра libbox (sing-box)
        run: |
          mkdir -p Frameworks
          # Используем стабильную прямую ссылку на последний релиз Libbox
          curl -L -o libbox.zip https://github.com/SagerNet/sing-box/releases/download/v1.11.0/Libbox.xcframework.zip || curl -L -o libbox.zip https://github.com/SagerNet/sing-box/releases/latest/download/Libbox.xcframework.zip
          unzip -q libbox.zip -d Frameworks/

      - name: Генерация проекта Xcode
        run: xcodegen generate

      - name: Сборка приложения
        run: |
          xcodebuild clean build \
            -project Argon.xcodeproj \
            -scheme Argon \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Упаковка в .ipa
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/Argon.app" Payload/
          zip -r Argon-Pro.ipa Payload

      - name: Выгрузка готового файла
        uses: actions/upload-artifact@v4
        with:
          name: Argon-Pro-IPA
          path: Argon-Pro.ipa
