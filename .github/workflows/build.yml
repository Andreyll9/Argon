name: Build Argon Lite IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Скачивание файлов проекта
        uses: actions/checkout@v4

      - name: Установка XcodeGen
        run: brew install xcodegen

      - name: Генерация проекта
        run: xcodegen generate

      - name: Сборка приложения
        run: |
          xcodebuild clean build \
            -project Argon.xcodeproj \
            -scheme Argon \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Упаковка в .ipa
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/Argon.app" Payload/
          zip -r Argon-Free.ipa Payload

      - name: Выгрузка готового файла
        uses: actions/upload-artifact@v4
        with:
          name: Argon-Free-IPA
          path: Argon-Free.ipa
