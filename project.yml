name: Argon
options:
  bundleIdPrefix: com.argon
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "16.0"

targets:
  Argon:
    type: application
    platform: iOS
    sources:
      - ArgonApp
    entitlements:
      path: Argon.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.argon.pro
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ArgonApp/Info.plist
    dependencies:
      - target: ArgonTunnel

  ArgonTunnel:
    type: app-extension
    platform: iOS
    sources:
      - ArgonTunnel
    entitlements:
      path: Argon.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.argon.pro.tunnel
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ArgonTunnel/Info.plist
        FRAMEWORK_SEARCH_PATHS: "$(PROJECT_DIR)/Frameworks"
    dependencies:
      - framework: Frameworks/Libbox.xcframework
        embed: true
