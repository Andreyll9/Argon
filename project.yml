name: Argon
options:
  bundleIdPrefix: com.argon
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "18.0" # Целевая версия iOS для вашего 13 mini

targets:
  Argon:
    type: application
    platform: iOS
    sources:
      - ArgonApp
    entitlements:
      path: Argon.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.argon.vpn.free
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ArgonApp/Info.plist
